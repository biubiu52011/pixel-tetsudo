# Deploy only committed main-branch content. Merges and direct pushes to main
# publish automatically after preflight checks; manual dispatch remains available.
name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Verify generated static configuration
        run: node data/core/gen-config-bundle.js --check
      - name: Generate ordered page scripts
        run: node scripts/sync-page-scripts.cjs
      - name: Test page script manifest
        run: node --test tests/page-scripts.test.cjs
      - name: Exercise line-scoped loader and SQL artwork contract
        run: node --test tests/train-detail-loader-runtime.test.cjs
      - name: Verify train overview DOM structure and state
        run: node --test tests/train-overview-dom.test.cjs
      - name: Verify geometry reuse only on position snapshots
        run: node --test tests/trains-geometry-position-snapshot.test.cjs
      - name: Verify UI content, accessibility and cross-page UX contracts
        run: |
          node --test tests/ux-content-clarity.test.cjs
          node --test tests/ux-accessibility.test.cjs
          node --test tests/ux-interaction-contract.test.cjs
          node --test tests/ux-3d-pixel-style.test.cjs
          node --test tests/ui-cross-page-consistency.test.cjs
          node --test tests/architecture-ownership.test.cjs
          node --test tests/rail-service-calendar-ownership.test.cjs
      - name: Verify train presets before Pages upload
        run: |
          node --check js/train-vehicle.js
          node --check data/core/major-vehicle-fleet-presets.js
          node tools/train-major-fleet-presets.test.cjs
          node --test tests/tourism-shops.test.cjs
          node --test tools/route-timetable-service-calendar.test.cjs
          node --test tools/hamakawasaki-transfer-badges.test.cjs
          node --test tools/yamanote-transfer-overflow.test.cjs
      - name: Verify run-information state handling
        run: |
          node --check js/runinfo-evaluator.js
          node --check js/runinfo-web.js
          node --test tests/runinfo-evaluator-partial-cancellation.test.cjs tests/runinfo-web-snapshot.test.cjs
          node tests/runinfo-regression.js
          node --test tests/runinfo-operator-delivery.test.cjs
      - name: Probe Seibu ODPT TrainInformation once
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const globals = { window: {} };
          vm.runInNewContext(fs.readFileSync('data/api/odpt-links.js', 'utf8'), globals);
          const seed = 'PixelTetsudo'.split('').reverse().join('') + '-' + 'ODPT'.split('').reverse().join('') + '-2026';
          const bytes = Buffer.from(globals.window.ODPT_LINKS_ENC, 'base64');
          for (let i = 0; i < bytes.length; i++) bytes[i] ^= seed.charCodeAt(i % seed.length);
          const urls = JSON.parse(bytes.toString('utf8'));
          const url = urls.find(u => u.includes('/odpt:TrainInformation?odpt:operator=odpt.Operator:Seibu'));
          if (!url || !url.includes('acl:consumerKey=')) throw Error('Seibu endpoint missing from configured links');
          (async () => {
            try {
              const response = await fetch(url, { headers: { 'Accept': 'application/json' }, signal: AbortSignal.timeout(12000) });
              const body = await response.text();
              console.log('Seibu endpoint HTTP status:', response.status);
              console.log('Response content-type:', response.headers.get('content-type') || 'none');
              if (response.ok) {
                try {
                  const decoded = JSON.parse(body);
                  const rows = Array.isArray(decoded) ? decoded : Array.isArray(decoded.value) ? decoded.value : null;
                  console.log('JSON rows:', rows === null ? 'unexpected shape' : rows.length);
                  if (rows && rows.length) {
                    const row = rows[0];
                    console.log('First record keys:', Object.keys(row).join(','));
                    const inspect = {};
                    ['@type','odpt:operator','odpt:railway','odpt:trainInformationText',
                     'odpt:trainInformationStatus','odpt:trainInformationCause',
                     'odpt:trainInformationRange','odpt:timeOfOrigin','dc:date','dct:valid'].forEach(k => {
                      if (Object.hasOwn(row,k)) inspect[k] = row[k];
                    });
                    console.log('First record operational fields:', JSON.stringify(inspect).slice(0,2800));
                    const railwayIds = [...new Set(rows.map(x => x['odpt:railway'] || '(operator-wide)').slice(0, 100))];
                    console.log('Returned railway identities:', JSON.stringify(railwayIds));
                  }
                } catch (e) { console.log('Response JSON parse failed:', e.name); }
              } else {
                console.log('Non-success response size (bytes):', Buffer.byteLength(body));
              }
            } catch (e) {
              console.log('Seibu endpoint request error:', e.name, e.cause && e.cause.code || '');
            }
          })();
          NODE
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
