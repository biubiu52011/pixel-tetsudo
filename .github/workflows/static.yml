# Deploy only committed main-branch content. Merges and direct pushes to main
# publish automatically after preflight checks; manual dispatch remains available.
name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Verify generated static configuration
        run: node data/core/gen-config-bundle.js --check
      - name: Generate ordered page scripts
        run: node scripts/sync-page-scripts.cjs --check
      - name: Test page script manifest
        run: node --test tests/page-scripts.test.cjs
      - name: Exercise line-scoped loader and SQL artwork contract
        run: node --test tests/train-detail-loader-runtime.test.cjs
      - name: Verify train overview DOM structure and state
        run: node --test tests/train-overview-dom.test.cjs
      - name: Verify geometry reuse only on position snapshots
        run: node --test tests/trains-geometry-position-snapshot.test.cjs
      - name: Verify UI content, accessibility and cross-page UX contracts
        run: |
          node --test tests/ux-content-clarity.test.cjs
          node --test tests/ux-accessibility.test.cjs
          node --test tests/ux-interaction-contract.test.cjs
          node --test tests/ux-3d-pixel-style.test.cjs
          node --test tests/ui-cross-page-consistency.test.cjs
          node --test tests/architecture-ownership.test.cjs
          node --test tests/rail-service-calendar-ownership.test.cjs
      - name: Verify train presets before Pages upload
        run: |
          node --check js/train-vehicle.js
          node --check data/core/major-vehicle-fleet-presets.js
          node tools/train-major-fleet-presets.test.cjs
          node --test tests/tourism-shops.test.cjs
          node --test tools/route-timetable-service-calendar.test.cjs
          node --test tools/hamakawasaki-transfer-badges.test.cjs
          node --test tools/yamanote-transfer-overflow.test.cjs
      - name: Verify run-information state handling
        run: |
          node --check js/runinfo-evaluator.js
          node --check js/runinfo-web.js
          node --test tests/runinfo-evaluator-partial-cancellation.test.cjs tests/runinfo-web-snapshot.test.cjs
          node tests/runinfo-regression.js
          node --test tests/runinfo-operator-delivery.test.cjs
      - name: Temporary Seibu ODPT HTTP probe (no credential output)
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const src = fs.readFileSync('data/api/odpt-links.js', 'utf8');
          const encoded = src.match(/window\.ODPT_LINKS_ENC\s*=\s*"([^"]+)"/)?.[1];
          if (!encoded) { console.log('SEIBU_PROBE missing_link_library'); process.exit(0); }
          const seed = 'PixelTetsudo'.split('').reverse().join('') + '-' + 'ODPT'.split('').reverse().join('') + '-2026';
          const cipher = Buffer.from(encoded, 'base64');
          for (let i = 0; i < cipher.length; i++) cipher[i] ^= seed.charCodeAt(i % seed.length);
          const list = JSON.parse(cipher.toString('utf8'));
          const url = list.find(v => v.includes('/odpt:TrainInformation?') && v.includes('odpt.Operator:Seibu'));
          if (!url) { console.log('SEIBU_PROBE no_seibu_endpoint'); process.exit(0); }
          const ac = new AbortController();
          const t = setTimeout(() => ac.abort(), 12000);
          fetch(url, {signal: ac.signal, headers: {Accept: 'application/json'}}).then(async response => {
            const body = await response.text();
            let json = null;
            try { json = JSON.parse(body); } catch (_) {}
            const records = Array.isArray(json) ? json : Array.isArray(json?.value) ? json.value : null;
            const sample = records?.slice(0, 3).map(row => ({
              operator: row['odpt:operator'] || null,
              railway: row['odpt:railway'] || null,
              status: row['odpt:trainInformationStatus'] || null,
              text: String(typeof row['odpt:trainInformationText'] === 'string'
                ? row['odpt:trainInformationText']
                : row['odpt:trainInformationText']?.ja || '').slice(0, 140)
            }));
            console.log('SEIBU_PROBE', JSON.stringify({
              httpStatus: response.status, ok: response.ok,
              contentType: response.headers.get('content-type'),
              payloadType: records ? 'array' : typeof json,
              recordCount: records?.length ?? null, sample: sample || [],
              errorType: !response.ok ? (json?.error || json?.code || null) : null
            }));
          }).catch(error => console.log('SEIBU_PROBE', JSON.stringify({
            networkFailure: error.name, message: error.message
          }))).finally(() => clearTimeout(t));
          NODE
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
