name: One-off Fukuchiyama Danbaro Rapid November 2026 API smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fukuchiyama-danbaro-live-check-once.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify deployed train-runs ordinary Rapid classes and November 28 cancellation
        run: |
          node <<'JS'
          const base='https://pnupwfmgbtxqhpzsrhfn.supabase.co/functions/v1/train-runs';
          async function get(day){
            const r=await fetch(base+'?line_id=Fukuchiyama&service_date='+day,
              {headers:{accept:'application/json'},signal:AbortSignal.timeout(55000)});
            const body=await r.text();
            if(!r.ok)throw Error(day+' HTTP '+r.status+' '+body.slice(0,1000));
            const j=JSON.parse(body);
            if(j.ok!==true || !Array.isArray(j.runs))throw Error(day+' unexpected payload '+body.slice(0,1200));
            return j;
          }
          function getOne(j,no){
            const found=j.runs.filter(x=>x.train_number===no);
            if(found.length!==1)throw Error('expected one '+no+' but '+found.length);
            return found[0];
          }
          const holiday=await get('2026-11-08');
          for(const num of ['2753','2759','2765','2772','2777','2779','2786']){
            const run=getOne(holiday,num+'MH');
            if(run.train_type!=='odpt.TrainType:JR-West.Rapid')
              throw Error('holiday '+num+' wrong type '+run.train_type);
          }
          for(const num of ['2751','2763','2764','2766','2778']){
            if(holiday.runs.some(x=>x.train_number===num+'MH'))
              throw Error(num+' should not run Saturday/Holiday');
          }
          console.log('2026-11-08 PASS', {runs:holiday.runs.length,weekdayOnlyExcluded:5});
          const weekday=await get('2026-11-09');
          for(const num of ['2751','2753','2759','2763','2764','2765','2766','2772','2777','2778','2779','2786']){
            const run=getOne(weekday,num+'M');
            if(run.train_type!=='odpt.TrainType:JR-West.Rapid')
              throw Error('weekday '+num+' wrong type '+run.train_type);
          }
          console.log('2026-11-09 PASS', {runs:weekday.runs.length,verifiedTypes:12});
          const disrupted=await get('2026-11-28');
          const r=getOne(disrupted,'2779MH');
          if(r.train_type!=='odpt.TrainType:JR-West.Rapid' ||
             r.stops.length!==9 ||
             r.stops[0].station_key!=='Osaka' ||
             r.stops[8].station_key!=='Shinmita' ||
             r.stops.some(x=>x.station_key==='Shinoyamaguchi')||
             r.timetable_validity!=='partial_service_disruption'||
             r.timetable_date_verified===true)
            throw Error('2026-11-28 2779M canceled section projected '+JSON.stringify(r).slice(0,1600));
          console.log('2026-11-28 PASS partial 2779M Osaka--Shinmita only');
          JS
