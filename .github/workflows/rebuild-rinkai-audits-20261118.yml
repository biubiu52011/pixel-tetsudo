name: One-shot rebuild of Rinkai number audit snapshots
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-rinkai-audits-20261118.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate snapshots from latest main with non-force push retries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "rebuild attempt ${attempt}"
            git fetch origin main
            git reset --hard origin/main
            node tools/build-train-number-png-catalog.cjs --write --write-inventory
            node tools/build-png-to-train-number-index.cjs --write
            node tools/build-train-number-png-catalog.cjs --check --check-inventory --strict
            node tools/build-png-to-train-number-index.cjs --check
            node --test tests/rinkai-70-000-71-000-t-numbers-2611.test.cjs tests/train-number-png-catalog.test.cjs
            rm -f .github/workflows/rebuild-rinkai-audits-20261118.yml
            git add -A -- data/audits/train-number-png-catalog-2611.json data/audits/png-first-number-band-inventory-20261117.csv data/audits/png-to-train-number-index-2611.json data/audits/png-to-train-number-index-2611.csv .github/workflows/
            if git diff --cached --quiet; then
              echo "Nothing to change"; exit 0
            fi
            git commit -m "chore: regenerate Rinkai train-number PNG audit outputs"
            if git push origin HEAD:main; then
              echo "Regenerated snapshots committed to main"; exit 0
            fi
            echo "Remote main moved; retrying from latest HEAD"
            sleep 2
          done
          echo "Could not push regenerated snapshots after retries" >&2
          exit 1
