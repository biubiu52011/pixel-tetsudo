name: One-shot rebuild of Rinkai number audit snapshots
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-rinkai-audits-20261118.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild canonical Rinkai range audit outputs and verify
        shell: bash
        run: |
          set -euo pipefail
          node tools/build-train-number-png-catalog.cjs --write --write-inventory
          node tools/build-png-to-train-number-index.cjs --write
          node tools/build-train-number-png-catalog.cjs --check --check-inventory --strict
          node tools/build-png-to-train-number-index.cjs --check
          node --test tests/rinkai-70-000-71-000-t-numbers-2611.test.cjs tests/train-number-png-catalog.test.cjs
          rm .github/workflows/rebuild-rinkai-audits-20261118.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/train-number-png-catalog-2611.json data/audits/png-first-number-band-inventory-20261117.csv data/audits/png-to-train-number-index-2611.json data/audits/png-to-train-number-index-2611.csv .github/workflows/rebuild-rinkai-audits-20261118.yml
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate Rinkai train-number PNG audit outputs"
            git push origin HEAD:main
          fi
