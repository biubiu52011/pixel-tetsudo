name: One-off Fukuchiyama Friday vehicle evidence pipeline debug
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fukuchiyama-friday-vehicle-pipeline-debug-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live 7025M and 3008M reference fields
        run: |
          node <<'JS'
          for(const [date,num] of [['2026-11-06','7025M'],['2026-11-08','3008MH']]){
            const url='https://pnupwfmgbtxqhpzsrhfn.supabase.co/functions/v1/train-runs?line_id=Fukuchiyama&service_date='+date;
            const r=await fetch(url,{headers:{accept:'application/json'},signal:AbortSignal.timeout(50000)});
            const body=await r.text();
            if(!r.ok)throw Error(r.status+' '+body.slice(0,800));
            const data=JSON.parse(body);
            const x=(data.runs||[]).find(y=>y.train_number===num);
            if(!x)throw Error(date+' '+num+' missing');
            const proof=x.published_number_fleet_reference;
            const summary={date,num,
              mappingLevel:x.vehicle_mapping_level,
              candidate:x.vehicle_type_candidates,
              planConfirmed:x.vehicle_plan_confirmed,
              dateVerified:x.timetable_date_verified,
              actualCar:x.actual_vehicle_confirmed,
              sourceId:x.source_template_id,
              proofSource:proof?.source,
              proofModels:proof?.candidateModels,
              proofStopKeys:proof?.sourceStopKeys,
              keys:Object.keys(x).filter(k=>/vehicle|fleet|proof|position|timetable|source/i.test(k)).slice(0,40)};
            console.log('API DETAIL',JSON.stringify(summary));
            if(!proof || !Array.isArray(proof.candidateModels))
              throw Error(date+' missing published family proof');
          }
          JS
