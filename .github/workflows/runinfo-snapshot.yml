name: Refresh official monorail run information

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runinfo-snapshot-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Test official status parser
        run: |
          node --test tests/runinfo-evaluator-partial-cancellation.test.cjs tests/runinfo-web-snapshot.test.cjs
          node tests/runinfo-regression.js
      - name: Fetch official homepage status
        run: node tools/refresh-runinfo-web.cjs
      - name: Publish fresh snapshot only when available
        run: |
          if git diff --quiet -- data/runinfo-web-snapshot.json; then
            echo "No verified changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/runinfo-web-snapshot.json
          git commit -m "chore(runinfo): refresh official status snapshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
