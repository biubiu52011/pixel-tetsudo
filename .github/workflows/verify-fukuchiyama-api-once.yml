name: One-off Fukuchiyama Nov 2026 API smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-fukuchiyama-api-once.yml'

permissions:
  contents: read

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert deployed train-runs API matches November northern sources
        shell: bash
        run: |
          node <<'JS'
          const base='https://pnupwfmgbtxqhpzsrhfn.supabase.co/functions/v1/train-runs';
          const cases=[
            ['2026-11-08','H'],
            ['2026-11-09','']
          ];
          async function get(day) {
            const url=base+'?line_id=Fukuchiyama&service_date='+day;
            const r=await fetch(url,{signal:AbortSignal.timeout(35000),
              headers:{'Accept':'application/json'}});
            const raw=await r.text();
            if(!r.ok)throw Error(day+' HTTP '+r.status+': '+raw.slice(0,1000));
            const out=JSON.parse(raw);
            if(out.ok!==true || !Array.isArray(out.runs))
              throw Error(day+' API error '+raw.slice(0,1200));
            return out;
          }
          for(const [day,suffix] of cases) {
            const result=await get(day);
            const expected=[
              ['2531M'+suffix,10,'odpt.TrainType:JR-West.Local'],
              ['2528M'+suffix,10,'odpt.TrainType:JR-West.Local'],
              ['2532M'+suffix,10,'odpt.TrainType:JR-West.Local'],
              ['3008M'+suffix,9,'odpt.TrainType:JR-West.LimitedExpress'],
              ['3010M'+suffix,7,'odpt.TrainType:JR-West.LimitedExpress']
            ];
            for(const [number,stops,type] of expected) {
              const hit=result.runs.filter(run=>run.train_number===number);
              if(hit.length!==1)throw Error(day+' '+number+' count='+hit.length);
              const x=hit[0];
              if(x.stops.length!==stops || x.train_type!==type ||
                 x.timetable_date_verified!==true ||
                 x.vehicle_plan_confirmed!==false ||
                 x.vehicle_artwork_path!==null)
                throw Error(day+' '+number+' unexpected source mapping '+JSON.stringify({
                  n:x.stops.length,type:x.train_type,dated:x.timetable_date_verified,
                  vehiclePlan:x.vehicle_plan_confirmed,art:x.vehicle_artwork_path}));
              if(number.startsWith('300') && x.vehicle_type_candidates!=='287系 / 289系')
                throw Error(day+' '+number+' wrong express candidate: '+x.vehicle_type_candidates);
              if(x.stops[0].station_key!==(number.startsWith('2531')?'Shinoyamaguchi':'Fukuchiyama'))
                throw Error(day+' '+number+' wrong start station');
            }
            if(result.complete!==false || result.partial!==true)
              throw Error(day+' incorrectly claims full timetable');
            console.log(day,'PASS',{runs:result.runs.length,selectedCalendar:result.selected_calendar,
              partial:result.partial,dated:result.date_verified_runs});
          }
          const outside=await get('2026-12-01');
          const prohibited=new Set(['2531M','2528M','2532M','3008M','3010M']);
          const leaked=outside.runs.filter(x=>prohibited.has(x.train_number));
          if(leaked.length)throw Error('official 2611 samples leaked into December '+leaked.map(x=>x.train_number));
          console.log('2026-12-01 PASS (no 2611 sample leakage)');
          JS
