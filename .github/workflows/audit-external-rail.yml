# Public, read-only observations; external API outages never block Pages.
name: Audit external railway data (read-only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-external-rail.yml'
      - 'tools/audit-edge-train-runs-runtime.cjs'
      - 'tools/audit-train-number-png-runtime.cjs'
      - 'data/api/odpt-unified.js'
      - 'js/train-vehicle.js'
      - 'data/timetables/train-number-png-ranges.js'
      - 'tools/audit-tobu-odpt-number-bands.cjs'
      - 'tests/tobu-odpt-number-band-audit.test.cjs'
      - 'tools/audit-toei-odpt-live.cjs'
      - 'tests/toei-odpt-number-format-audit.test.cjs'
      - 'supabase/functions/train-runs/index.ts'
      - 'supabase/migrations/20261113183000_tobu_skytree_tokyogtfs_plan_fallback.sql'
      - 'supabase/migrations/20261113191000_tobu_noda_tokyogtfs_plan_fallback.sql'
  workflow_dispatch:
    inputs:
      scope:
        description: Select read-only probe
        required: true
        type: choice
        default: all
        options:
          - all
          - live-train
          - tobu
          - toei
          - gtfs-runtime

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      live: ${{ steps.scope.outputs.live }}
      tobu: ${{ steps.scope.outputs.tobu }}
      toei: ${{ steps.scope.outputs.toei }}
      gtfs: ${{ steps.scope.outputs.gtfs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine changed source or manual scope
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ inputs.scope }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          live=0; tobu=0; toei=0; gtfs=0
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            case "$SCOPE" in
              all) live=1; tobu=1; toei=1; gtfs=1 ;;
              live-train) live=1 ;;
              tobu) tobu=1 ;;
              toei) toei=1 ;;
              gtfs-runtime) gtfs=1 ;;
              *) echo "::error::Unknown audit scope"; exit 1 ;;
            esac
          else
            before="$BEFORE"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              before="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
            if [[ -z "$before" ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              live=1; tobu=1; toei=1; gtfs=1
            else
              while IFS= read -r file; do
                case "$file" in
                  .github/workflows/audit-external-rail.yml)
                    live=1; tobu=1; toei=1; gtfs=1 ;;
                  tools/audit-edge-train-runs-runtime.cjs|tools/audit-train-number-png-runtime.cjs|data/api/odpt-unified.js|js/train-vehicle.js|data/timetables/train-number-png-ranges.js)
                    live=1 ;;
                  tools/audit-tobu-odpt-number-bands.cjs|tests/tobu-odpt-number-band-audit.test.cjs)
                    tobu=1 ;;
                  tools/audit-toei-odpt-live.cjs|tests/toei-odpt-number-format-audit.test.cjs)
                    toei=1 ;;
                  supabase/functions/train-runs/index.ts|supabase/migrations/20261113183000_tobu_skytree_tokyogtfs_plan_fallback.sql|supabase/migrations/20261113191000_tobu_noda_tokyogtfs_plan_fallback.sql)
                    gtfs=1 ;;
                esac
              done < <(git diff --name-only "$before" HEAD)
            fi
          fi
          echo "live=$live" >> "$GITHUB_OUTPUT"
          echo "tobu=$tobu" >> "$GITHUB_OUTPUT"
          echo "toei=$toei" >> "$GITHUB_OUTPUT"
          echo "gtfs=$gtfs" >> "$GITHUB_OUTPUT"
          echo "audit scope live=$live tobu=$tobu toei=$toei gtfs=$gtfs"

  live-train:
    needs: detect
    if: needs.detect.outputs.live == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate offline regression harness and live probe syntax
        run: |
          node --check tools/audit-train-number-png-runtime.cjs
          node --check tools/audit-edge-train-runs-runtime.cjs
          node tools/audit-train-number-png-runtime.cjs --strict > /tmp/train-png-offline.json
          node -e "const r=require('/tmp/train-png-offline.json');if(r.sampleRows!==174||r.returnVehicleRows!==89||r.safetyIssues.length||r.negativeProbes['future-service-date'].allowedStillImage!==3||r.negativeProbes['future-service-date'].unexpectedStillImage)process.exit(1);console.log(JSON.stringify({sourceRows:r.sampleRows,svgPng:r.returnVehicleRows,neutral:r.returnNeutralRows}));"
      - name: Probe live Edge (read-only) through actual browser adapter and SVG selector
        run: |
          node tools/audit-edge-train-runs-runtime.cjs \
            --date=2026-11-16 \
            --lines=SaikyoKawagoe,Gotemba,ChuoCentral,TokaidoShinkansen,JoetsuShinkansen,AkitaShinkansen \
            --strict > /tmp/train-png-live.json
          node -e "const r=require('/tmp/train-png-live.json');console.log(JSON.stringify(r));"

  tobu-numbers:
    needs: detect
    if: needs.detect.outputs.tobu == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only number parser and identity barriers
        run: |
          node --check tools/audit-tobu-odpt-number-bands.cjs
          node --test tests/tobu-odpt-number-band-audit.test.cjs
      - name: Observe operator-published Tobu numbers through existing protected proxy
        run: |
          node tools/audit-tobu-odpt-number-bands.cjs \
            --output=/tmp/tobu-odpt-number-audit.json \
            --summary="$GITHUB_STEP_SUMMARY" \
            --require-observation
      - name: Retain number-only comparison snapshot for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tobu-number-reference-observation
          path: /tmp/tobu-odpt-number-audit.json
          retention-days: 7
          if-no-files-found: warn

  toei-numbers:
    needs: detect
    if: needs.detect.outputs.toei == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Reject unsupported source-number conversions
        run: node --test tests/toei-odpt-number-format-audit.test.cjs
      - name: Observe one public ODPT snapshot
        run: node tools/audit-toei-odpt-live.cjs --output /tmp/toei-odpt-observation.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Retain aggregated snapshot for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toei-odpt-number-observation
          path: /tmp/toei-odpt-observation.json
          if-no-files-found: warn
          retention-days: 7

  gtfs-runtime:
    needs: detect
    if: needs.detect.outputs.gtfs == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check live GTFS-sourced plan, weekends, and expiry
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base='https://pnupwfmgbtxqhpzsrhfn.supabase.co/functions/v1/train-runs'
          cases = [
              ('TobuSkytree', 'Tobu.TobuSkytree.', [('2026-11-13',909),('2026-11-14',829),('2027-11-03',0)]),
              ('Noda', 'Tobu.TobuUrbanPark.', [('2026-11-13',652),('2026-11-14',595),('2027-11-03',0)]),
          ]
          for line, trip_prefix, dates in cases:
              prefix='gtfs-stage:TokyoGTFS:bb1bf605817e7a3a65caffbcd019843aa0ffd5cb3b2c9fbb0444c8b3072ff87f:'+line
              for day, expected in dates:
                  qs=urllib.parse.urlencode({'line_id':line,'service_date':day})
                  with urllib.request.urlopen(base+'?'+qs,timeout=90) as resp:
                      if resp.status!=200: raise RuntimeError('Edge status='+str(resp.status))
                      obj=json.load(resp)
                  if obj.get('ok') is not True:
                      raise AssertionError(f'{line} {day}: '+str(obj.get('error')))
                  runs=obj.get('runs')
                  if not isinstance(runs,list) or len(runs)!=expected:
                      raise AssertionError(f'{line} {day}: expected {expected} runs, received {len(runs) if isinstance(runs,list) else type(runs)}')
                  for run in runs:
                      assert run.get('timetable_provenance')==prefix, (line,day,run.get('timetable_provenance'))
                      assert run.get('source_trip_id','').startswith(trip_prefix), (line,day)
                      assert run.get('service_date')==day, (line,day)
                      assert len(run.get('stops') or [])>=2, (line,day)
                      assert not run.get('vehicle_plan_confirmed'), 'GTFS train number is not physical vehicle evidence'
                  print(line,day,'verified',len(runs),'scheduled GTFS source-only trips')
          PY
