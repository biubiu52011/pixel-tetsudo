name: Audit live train-runs adapter and PNG evidence

# Read-only request to the site's existing PUBLIC (verify_jwt=false) Edge API.
# No Supabase service role keys, no new fleet tables, and no publication.
# Separate from the Pages deployment gate: connectivity cannot block release.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-live-train-png.yml'
      - 'tools/audit-edge-train-runs-runtime.cjs'
      - 'tools/audit-train-number-png-runtime.cjs'
      - 'data/api/odpt-unified.js'
      - 'js/train-vehicle.js'
      - 'data/timetables/train-number-png-ranges.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-live-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate offline regression harness and live probe syntax
        run: |
          node --check tools/audit-train-number-png-runtime.cjs
          node --check tools/audit-edge-train-runs-runtime.cjs
          node tools/audit-train-number-png-runtime.cjs --strict > /tmp/train-png-offline.json
          node -e "const r=require('/tmp/train-png-offline.json');if(r.sampleRows!==174||r.returnVehicleRows!==89||r.safetyIssues.length||r.negativeProbes['future-service-date'].allowedStillImage!==3||r.negativeProbes['future-service-date'].unexpectedStillImage)process.exit(1);console.log(JSON.stringify({sourceRows:r.sampleRows,svgPng:r.returnVehicleRows,neutral:r.returnNeutralRows}));"
      - name: Probe live Edge (read-only) through actual browser adapter and SVG selector
        run: |
          node tools/audit-edge-train-runs-runtime.cjs \
            --date=2026-11-16 \
            --lines=SaikyoKawagoe,Gotemba,ChuoCentral,TokaidoShinkansen,JoetsuShinkansen,AkitaShinkansen \
            --strict > /tmp/train-png-live.json
          node -e "const r=require('/tmp/train-png-live.json');console.log(JSON.stringify(r));"
