name: Verify train PNG contracts

# 不使用 PR；直接提交 main 仅运行验证，不触发 Pages 发布。
on:
  push:
    branches: [main]
    paths:
      - 'js/train-vehicle.js'
      - 'js/trains-render.js'
      - 'js/data-fusion.js'
      - 'js/train-position-estimator.js'
      - 'tools/train-png-display-contract.test.cjs'
      - 'tools/train-vehicle-assets.test.cjs'
      - 'tools/train-sql-vehicle-mapping.test.cjs'
      - 'tools/train-sql-service-reconciliation.test.cjs'
      - 'tools/train-official-source-crosswalk.test.cjs'
      - 'tools/train-official-fleet-plan.test.cjs'
      - 'tools/train-conventional-source-mapping.test.cjs'
      - 'tools/train-conventional-expansion.test.cjs'
      - 'tools/train-regional-fleet-scope.test.cjs'
      - 'tools/train-railfan-official-corroboration.test.cjs'
      - 'supabase/migrations/20261030112329_separate_shinkansen_service_names_and_audit_run_links.sql'
      - 'supabase/migrations/20261030112949_quarantine_seibu_laview_legacy_vehicle_labels.sql'
      - 'supabase/migrations/20261030114512_crosswalk_official_train_run_numbers_to_service_names_20261030.sql'
      - 'supabase/migrations/20261030114616_official_nishi_kyushu_n700s_scoped_planned_fleet_20261030.sql'
      - 'supabase/migrations/20261030115225_jr_kyushu_mixed_n700_800_service_plan_without_guess_20261030.sql'
      - 'supabase/migrations/20261030115316_official_sanyo_multiple_n700_variants_prevent_png_guess_20261030.sql'
      - 'supabase/migrations/20261030115351_join_official_service_runs_to_scoped_planned_vehicle_families_20261030.sql'
      - 'supabase/migrations/20261030115444_official_tokaido_n700_n700a_n700s_planned_candidates_20261030.sql'
      - 'supabase/migrations/20261030121254_official_conventional_seibu_jrwest_jrkyushu_plan_fleet_20261030.sql'
      - 'supabase/migrations/20261030121401_quarantine_seibu_yamaguchi_8500_only_obsolete_candidate_20261030.sql'
      - 'supabase/migrations/20261030121430_audit_source_scoped_conventional_timetable_fleet_plans_20261030.sql'
      - 'supabase/migrations/20261030122739_official_keio_tobu_kuroshio_conventional_fleet_20261030.sql'
      - 'supabase/migrations/20261030125204_scoped_conventional_local_fleet_and_corridor_evidence_20261030.sql'
      - 'supabase/migrations/20261030130459_railfan_source_registry_and_official_sonic_two_stop_crosscheck_20261030.sql'
      - 'pages/trains.html'
      - '.github/workflows/verify-train-png.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check js/train-vehicle.js
          node --check js/trains-render.js
          node --check js/data-fusion.js
          node --check js/train-position-estimator.js
      - name: Verify vehicle PNG decisions and SVG projection
        run: node tools/train-png-display-contract.test.cjs
      - name: Verify registered PNG paths and file headers
        run: node tools/train-vehicle-assets.test.cjs
      - name: Verify SQL candidate identity boundaries
        run: node tools/train-sql-vehicle-mapping.test.cjs
      - name: Verify Shinkansen service-name and strict run-link boundaries
        run: node tools/train-sql-service-reconciliation.test.cjs
      - name: Verify sourced service crosswalk and scoped N700S model
        run: node tools/train-official-source-crosswalk.test.cjs
      - name: Verify sourced JR mixed fleet plans never become exact PNGs
        run: node tools/train-official-fleet-plan.test.cjs
      - name: Verify conventional-line scoped source maps and no-guessing boundaries
        run: node tools/train-conventional-source-mapping.test.cjs
      - name: Verify scoped Keio and Tobu artwork and multi-vehicle Kuroshio
        run: node tools/train-conventional-expansion.test.cjs
      - name: Verify non-exclusive JR West fleet and JR Kyushu corridor references
        run: node tools/train-regional-fleet-scope.test.cjs
      - name: Verify fan-source audit and official Sonic double-clock matches
        run: node tools/train-railfan-official-corroboration.test.cjs
