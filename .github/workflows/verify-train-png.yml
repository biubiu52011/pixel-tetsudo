      - 'supabase/migrations/20261106190000_chuo_sobu_local_2611_historical_1179_source_scope_and_m_exclusions.sql'
      - 'supabase/migrations/20261106180000_rikuto_east_2611_96_official_sources_8_legacy_exclusions.sql'
