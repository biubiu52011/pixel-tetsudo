permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize page script versions before train runtime checks
        run: node scripts/sync-page-scripts.cjs
      - name: Validate generated page script dependencies
        run: node --test tests/page-scripts.test.cjs
      - name: Check JavaScript syntax
        run: |
          node --check js/train-vehicle.js
          node --check data/timetables/vehicle-garage-png-map.js
          node --check data/core/major-vehicle-fleet-presets.js
          node --check js/trains-render.js
          node --check js/data-fusion.js
          node --check js/train-position-estimator.js
          node --check data/timetables/jreast-ishinomaki-2611-number-index.js
          node --check data/timetables/jreast-oga-2611-number-index.js
          node --check data/timetables/jreast-rikuto-east-2611-number-index.js
          node --check data/timetables/jreast-rikutsu-west-2611-number-index.js
          node --check data/timetables/jreast-ominato-2611-number-index.js
          node --check data/timetables/jreast-iiyama-2611-number-index.js
          node --check data/timetables/jreast-hakushin-2611-number-index.js
          node --check data/timetables/jreast-kitakami-2611-number-index.js
