      - 'tests/jreast-canonical-train-number-segments.test.cjs'
      - 'tests/boso-2611-dated-service-exceptions.test.cjs'
      - 'pages/trains.html'
      - '.github/workflows/verify-train-png.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize page script versions before train runtime checks
        run: node scripts/sync-page-scripts.cjs
      - name: Validate generated page script dependencies
        run: node --test tests/page-scripts.test.cjs
      - name: Check JavaScript syntax
        run: |
          node --check js/train-vehicle.js
          node --check data/timetables/vehicle-garage-png-map.js
          node --check data/core/major-vehicle-fleet-presets.js
          node --check js/trains-render.js
          node --check js/data-fusion.js
          node --check js/train-position-estimator.js
          node --check data/timetables/jreast-ishinomaki-2611-number-index.js
          node --check data/timetables/jreast-oga-2611-number-index.js
          node --check data/timetables/jreast-rikuto-east-2611-number-index.js
          node --check data/timetables/jreast-rikutsu-west-2611-number-index.js
          node --check data/timetables/jreast-ominato-2611-number-index.js
          node --check data/timetables/jreast-iiyama-2611-number-index.js
          node --check data/timetables/jreast-hakushin-2611-number-index.js
          node --check data/timetables/jreast-kitakami-2611-number-index.js
          node --check data/timetables/jreast-yamada-2611-number-index.js
          node --check data/timetables/jreast-regional-2611-number-index.js
      - name: Verify train-runs SQL batching and JR canonical identity
        run: node --test tests/train-runs-query-batches.test.cjs tests/jreast-canonical-train-number-segments.test.cjs
      - name: Verify Boso dated official number exceptions and historical SQL guards
        run: node --test tests/boso-2611-dated-service-exceptions.test.cjs tests/boso-202611-schedule-fallback.test.cjs
      - name: Verify scoped major vehicle fleet presets and neutral markers
        run: node tools/train-major-fleet-presets.test.cjs
      - name: Verify visual folding of dense train markers on SVG maps
        run: node tools/train-visual-fold.test.cjs
      - name: Verify Yamanote crowded transfer +N SVG layout
        run: node --test tools/yamanote-transfer-overflow.test.cjs
      - name: Audit all 237 railway routes, 191 fleet scopes and gallery references
        run: node tools/train-network-vehicle-audit.test.cjs
      - name: Verify all garage PNG-to-stock maps and official train references
        run: node tools/vehicle-garage-png-map.test.cjs
      - name: Verify realtime and SQL number-to-PNG on SVG maps
        run: node --test tests/train-number-png-runtime.test.cjs tests/yokosuka-sobu-202611-number-png.test.cjs
      - name: Verify regional 2611 Ishinomaki / Oga official numbers and PNG guards
        run: node --test tests/ishinomaki-2611-official-number-png.test.cjs tests/oga-2611-official-number-png.test.cjs
      - name: Verify Kitakami and Yamada 2611 public numbers, flood/rockfall, valid PNGs
        run: node --test tests/kitakami-2611-official-number-png.test.cjs tests/kitakami-2611-sql-full-roster.test.cjs tests/yamada-2611-official-number-png.test.cjs
      - name: Verify 54 Iiyama locals and dated Oykot / Shu Kura service numbers
        run: node --test tests/iiyama-2611-official-number-png.test.cjs
      - name: Verify Ominato Nov 2026 exact services and maintenance cancellations
        run: node --test tests/ominato-2611-official-number-estimate.test.cjs
      - name: Verify OuMain Nov 2026 six E751 Tsugaru number-to-PNG guards
        run: node --test tests/oumain-2611-tsugaru-e751-exact-number-png.test.cjs tests/oumain-2611-source-segment-safety.test.cjs
      - name: Verify Rikutsu West Nov 2026 official numbers and Mogamigawa Rapid
        run: node --test tests/rikutsu-west-2611-official-number-png.test.cjs
      - name: Verify Rikuto East Nov 2026 numbers, special rapids and flood closure
        run: node --test tests/rikuto-east-2611-official-number-png.test.cjs
      - name: Verify regional 2611 Kururi Karasuyama Hachinohe official numbers and exceptions
        run: node --test tests/jreast-regional-2611-number-png.test.cjs
      - name: Verify 2611 Hakushin 91 E129 trains, 7 Inaho, Kairi dates and no wrong art
        run: node --test tests/hakushin-2611-official-number-png.test.cjs
      - name: Verify Joetsu 2611 train-number, northern/southern fleets and Shu*Kura calendar
        run: node --test tests/joetsu-2611-number-vehicle.test.cjs
      - name: Verify Kamaishi 2611 SQL-number model and Hinabi calendar
        run: node --test tests/kamaishi-2611-sql-number-vehicle.test.cjs
      - name: Verify Kashima 2611 SQL number, November 7 swaps, E131/E235 reference artwork
        run: node --test tests/kashima-2611-sql-number-png.test.cjs
      - name: Verify Kesennuma 2611 rail and BRT exclusion, November maintenance, KiHa110 art
        run: node --test tests/kesennuma-2611-rail-sql-number-png.test.cjs
      - name: Verify Komii 2611 published services, rockfall, HIGH RAIL dates and PNG
        run: node --test tests/komii-2611-sql-number-png.test.cjs
      - name: Verify Hanawa 2611 official train number, date and PNG
        run: node --test tests/hanawa-2611-exact-number-png.test.cjs
      - name: Verify Kururi 2611 open-rail scope and KiHaE130 PNG
        run: node --test tests/kururi-2611-open-rail-number-png.test.cjs
      - name: Verify Mito 2611 exact-number and dated E531 family PNG
        run: node --test tests/mito-2611-exact-number-e531.test.cjs
      - name: Verify Miyo Yahiko 2611 E129 seasonal numbers and dates
        run: node --test tests/miyo-2611-yahiko-e129-dated-number.test.cjs
      - name: Verify Oito JR-West 2611 company split, 4xxD number proof and no false PNG
        run: node --test tests/oito-west-2611-company-kiha120-number.test.cjs
      - name: Verify Oito JR-East only 2611 SQL number and stock proof
        run: node --test tests/oito-east-2611-sql-scope.test.cjs
      - name: Verify Ofunato 2611 rail/BRT and Pokemon proof
        run: node --test tests/ofunato-2611-rail-brt-pokemon-number-png.test.cjs
      - name: Verify Gono 2611 numbered planned-service rendering and date admission
        run: node --test tests/gono-2611-number-schedule.test.cjs
      - name: Verify Suigun 2611 main/branch KiHa E130, dated extras and missing Kazekko art
        run: node --test tests/suigun-2611-number-fleet.test.cjs tests/suigun-2611-edge-calendar.test.cjs tests/suigun-branch-2611-completeness.test.cjs tests/suigun-branch-2611-through-continuity.test.cjs
      - name: Verify Tadami 2611 base numbers, source-scope, holiday rules and gallery PNG
        run: |
          node --check data/timetables/jreast-tadami-2611-number-index.js
          node --test tests/tadami-2611-number-map.test.cjs
      - name: Verify Tazawako 2611 regular 8xx locals without Komachi contamination or short duplicate
        run: |
          node --check data/timetables/jreast-tazawako-2611-number-index.js
          node --test tests/tazawako-2611-conventional-map.test.cjs
      - name: Verify Tsugaru 2611 open Aomori-Kanita 701 locals and 324M Saturday-only exception
        run: |
          node --check data/timetables/jreast-tsugaru-2611-number-index.js
          node --test tests/tsugaru-2611-number-map.test.cjs
      - name: Verify Uetsu 2611 cross-regional train numbers, timetable dates and PNG family scope
        run: |
          node --check data/timetables/jreast-uetsu-2611-number-index.js
          node --test tests/uetsu-2611-number-fleet-map.test.cjs
      - name: Verify Shinonoi 2611 383 Shinano, mixed locals and SQL scope
        run: node --test tests/shinonoi-2611-number-fleet.test.cjs tests/shinonoi-2611-edge-scope.test.cjs
      - name: Verify Senzan 2611 E721, SATONO PNG and date-filtered API positions
        run: node --test tests/senzan-2611-number-fleet.test.cjs tests/senzan-2611-edge-calendar.test.cjs
      - name: Verify Ryomo November 2611 exact numbers, 211 fleet and E231/E233 exceptions
        run: node --test tests/ryomo-2611-number-fleet.test.cjs
      - name: Verify Chuo-Sobu local historical 1179 sources, E235 transfer and Tozai isolation
        run: node --test tests/chuo-sobu-local-2611-source-scope-and-e235-fleet.test.cjs
      - name: Verify Chuo Main 2611 four-way published train-number inventory
        run: node --test tests/chuo-main-2611-number-index.test.cjs
      - name: Verify E233/E231 numbered mixed-fleet references and archived 215 trains
        run: |
          node --check data/timetables/jreast-shonan-mixed-number-index-202611.js
          node --test tests/shonan-215-202611-number-families.test.cjs
      - name: Verify dated references, Takao source handover and train split/join rules
        run: node --test tests/scheduled-vehicle-mapping.test.cjs tests/chuo-takao-source-handover.test.cjs tests/chuo-main-timetable-only.test.cjs tests/chuo-main-official-vehicle-index.test.cjs tests/train-coupling.test.cjs
      - name: Verify vehicle PNG decisions and SVG projection
        run: node tools/train-png-display-contract.test.cjs
      - name: Verify registered PNG paths and file headers
        run: node tools/train-vehicle-assets.test.cjs
      - name: Verify SQL candidate identity boundaries
        run: node tools/train-sql-vehicle-mapping.test.cjs
      - name: Verify Shinkansen service-name and strict run-link boundaries
        run: node tools/train-sql-service-reconciliation.test.cjs
      - name: Verify sourced service crosswalk and scoped N700S model
        run: node tools/train-official-source-crosswalk.test.cjs
      - name: Verify sourced JR mixed fleet plans never become exact PNGs
        run: node tools/train-official-fleet-plan.test.cjs
      - name: Verify conventional-line scoped source maps and no-guessing boundaries
        run: node tools/train-conventional-source-mapping.test.cjs
      - name: Verify scoped Keio and Tobu artwork and multi-vehicle Kuroshio
        run: node tools/train-conventional-expansion.test.cjs
      - name: Verify non-exclusive JR West fleet and JR Kyushu corridor references
        run: node tools/train-regional-fleet-scope.test.cjs
      - name: Verify fan-source audit and official Sonic double-clock matches
        run: node tools/train-railfan-official-corroboration.test.cjs
      - name: Verify official Hamakawasaki branch timetable and exact live isolation
        run: |
          node --check data/timetables/nambu-branch-official-202611.js
          node tools/nambu-branch-official-hybrid.test.cjs
      - name: Verify cross-line canonical identity and realtime hybrid boundaries
        run: |
          node tools/joban-canonical-realtime-hybrid.test.cjs
          node tools/joban-realtime-railway-scope.test.cjs
          node tools/chuo-ome-canonical-realtime-hybrid.test.cjs
          node tools/chuo-main-canonical-number-alias-hybrid.test.cjs
          node tools/shonan-tokaido-canonical-hybrid.test.cjs
          node tools/shonan-omiya-northern-canonical-hybrid.test.cjs
          node tools/boso-realtime-published-plan-audit.test.cjs
