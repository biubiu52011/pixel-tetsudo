      - 'supabase/migrations/20261106140000_oumain_2611_tsugaru_e751_exact_12_calendar_sources.sql'
      - 'supabase/migrations/20261106151000_oumain_2611_official_feb_snow_and_nov_9463_date_filter.sql'
      - 'supabase/migrations/20261105192621_train_runs_canonical_bundle_readonly_20261106.sql'
