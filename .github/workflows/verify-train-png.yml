        run: node --test tests/gakkentoshi-transfer-source-ownership.test.cjs
      - name: Verify JR Takarazuka full 31-station rail topology and generated bundles
        run: node --test tests/fukuchiyama-line-stations-2611.test.cjs
      - name: Verify JR Takarazuka historical fleet references (unconfirmed, no PNG)
        run: node --test tests/fukuchiyama-2611-fleet-reference.test.cjs
      - name: Verify JR Takarazuka C-number PNG illustration and M/MO candidate safety
        run: node --test tests/fukuchiyama-1199ch-candidate-marker.test.cjs
      - name: Verify northern Fukuchiyama local 223-5500 fleet stays line-scoped
        run: node --test tests/fukuchiyama-north-local-fleet-scope.test.cjs
      - name: Verify Fukuchiyama November 2531M official north sample and 2774M type reconciliation
        run: node --test tests/fukuchiyama-2611-official-north-sample.test.cjs
