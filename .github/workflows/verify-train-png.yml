      - name: Verify Tobu Noda official A-number bands and 5-car PNG candidate safety
        run: node --test tests/tobu-noda-fivecar-number-png.test.cjs tests/tobu-noda-2611-number-bands-sql.test.cjs tests/tobu-noda-illustrative-marker-png.test.cjs
