name: CI - Train/PNG contracts

# Reusable CI gate for Pages deployments; manual runs validate without publishing.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify gallery bytes, model scope and quarantine
        run: |
          node --check js/train-vehicle.js
          node --check data/timetables/vehicle-garage-png-map.js
          node --check tools/gallery-integrity-audit.cjs
          node tools/gallery-integrity-audit.cjs --strict
          node tools/vehicle-garage-png-map.test.cjs
          node tools/train-vehicle-assets.test.cjs
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # New timetable data belongs in existing Supabase tables, not new dated JS.
      # Batched PNG audits belong in existing regression suites and Notion logs.
      - name: Reject dated runtime entrypoints and per-batch audit files
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="${BEFORE_SHA:-}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -z "$base" ]]; then
            echo "No previous commit for added-file guard"; exit 0
          fi
          git diff --diff-filter=A --name-only "$base" HEAD > /tmp/added-train-project-files.txt
          git ls-files data/timetables data/api js supabase/functions > /tmp/active-train-runtime-files.txt
          node <<'NODE'
          const fs=require('node:fs');
          const added=fs.readFileSync('/tmp/added-train-project-files.txt','utf8').split(/\r?\n/).filter(Boolean);
          const active=fs.readFileSync('/tmp/active-train-runtime-files.txt','utf8').split(/\r?\n/).filter(Boolean);
          const dated=/(?:20\d{2}[-_]?(?:0[1-9]|1[0-2])|(?:^|[-_])\d{2}(?:0[1-9]|1[0-2])(?=[._-]))/;
          const runtime=/^(?:data\/timetables\/|data\/api\/|js\/|scripts\/|tools\/|supabase\/functions\/).*\.(?:js|cjs|mjs|ts)$/;
          const activeRuntime=/^(?:data\/timetables\/|data\/api\/|js\/|supabase\/functions\/).*\.(?:js|cjs|mjs|ts)$/;
          const batchTest=/^tests\/.*(?:^|[-_])(?:p|jr|private|metro|third|other)[-_]?\d{2}[-_].*\.test\.(?:js|cjs|mjs)$/i;
          const batchReport=/^docs\/audits\/.*(?:^|[-_])(?:p|jr|m|t|o)[-_]?\d{2}[-_].*\.md$/i;
          const datedGlobal=/(?:root|window|globalThis)\.[A-Za-z0-9_]*(?:20\d{2}(?:0[1-9]|1[0-2])|\d{2}(?:0[1-9]|1[0-2]))[A-Za-z0-9_]*\s*=/;
          const datedDispatch=/numberIndex\s*:\s*["'][^"']*(?:20\d{2}(?:0[1-9]|1[0-2])|[-_]\d{2}(?:0[1-9]|1[0-2]))[^"']*["']/;
          const addedForbidden=added.filter(p=>(runtime.test(p)&&dated.test(p))||batchTest.test(p)||batchReport.test(p));
          const activeForbidden=active.filter(p=>activeRuntime.test(p)&&dated.test(p));
          const datedExports=active.filter(p=>activeRuntime.test(p)&&datedGlobal.test(fs.readFileSync(p,'utf8')));
          const datedDispatches=active.filter(p=>activeRuntime.test(p)&&datedDispatch.test(fs.readFileSync(p,'utf8')));
          const forbidden=[...new Set([...addedForbidden,...activeForbidden,...datedExports,...datedDispatches])];
          if(forbidden.length){
            console.error('Date-specific runtime entrypoints/exports or redundant per-batch audit files are prohibited:');
            forbidden.forEach(p=>console.error('  '+p));
            console.error('Keep editions and validity windows in data fields; edit existing owner scripts/tests and keep batch logs in Notion.');
            process.exitCode=1;
          }else console.log('PASS: active runtime entrypoints are timeless and no redundant per-batch files were added');
          NODE
      - name: Validate Supabase migration version names
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const files = fs.readdirSync('supabase/migrations').filter(name => name.endsWith('.sql'));
          const seen = new Map();
          const issues = [];
          for (const name of files) {
            const match = /^(\d{14})_.+\.sql$/.exec(name);
            if (!match) { issues.push('Invalid migration filename: ' + name); continue; }
            const version = match[1];
            const n = (a, b) => Number(version.slice(a, b));
            const date = new Date(Date.UTC(n(0,4), n(4,6)-1, n(6,8), n(8,10), n(10,12), n(12,14)));
            if (date.toISOString().replace(/\D/g, '').slice(0, 14) !== version)
              issues.push('Invalid migration timestamp: ' + name);
            if (seen.has(version))
              issues.push('Duplicate migration version: ' + version + ' [' + seen.get(version) + ', ' + name + ']');
            seen.set(version, name);
          }
          if (issues.length) {
            for (const issue of issues) console.error(issue);
            process.exitCode = 1;
          } else {
            console.log('PASS: ' + files.length + ' migration files have unique, valid 14-digit versions');
          }
          NODE
      - name: Synchronize page script versions before train runtime checks
        run: node scripts/sync-page-scripts.cjs
      - name: Validate generated page script dependencies
        run: node --test tests/page-scripts.test.cjs
