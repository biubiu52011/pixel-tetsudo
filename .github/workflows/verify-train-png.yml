      - name: Replay dated SQL source train PNG and enforce cross-line safety
        run: |
          node --check tools/audit-train-number-png-runtime.cjs
          node tools/audit-train-number-png-runtime.cjs --strict > /tmp/train-number-png-runtime-audit.json
          node -e "const r=require('/tmp/train-number-png-runtime-audit.json'); if(r.sampleRows!==174 || r.distinctServiceKeys!==173 || r.returnVehicleRows+r.returnNeutralRows!==r.sampleRows || r.safetyIssues.length || r.negativeProbes['wrong-display-line'].stillImage || r.negativeProbes['missing-source-railway'].stillImage || r.negativeProbes['future-service-date'].stillImage) process.exit(1); console.log(JSON.stringify({dated:r.sampleRows,distinct:r.distinctServiceKeys,png:r.returnVehicleRows,neutral:r.returnNeutralRows,planned:r.plannedReferenceRows,paths:r.imagePaths,guards:r.negativeProbes}));"
