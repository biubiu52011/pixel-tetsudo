name: CI - Train/PNG contracts

# Reusable CI gate for Pages deployments; manual runs validate without publishing.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify gallery bytes, model scope and quarantine
        run: |
          node --check js/train-vehicle.js
          node --check data/timetables/vehicle-garage-png-map.js
          node --check tools/gallery-integrity-audit.cjs
          node tools/gallery-integrity-audit.cjs --strict
          node tools/vehicle-garage-png-map.test.cjs
          node tools/train-vehicle-assets.test.cjs
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize page script versions before train runtime checks
        run: node scripts/sync-page-scripts.cjs
      - name: Validate generated page script dependencies
        run: node --test tests/page-scripts.test.cjs
      - name: Verify whole-list line ranks, canonical identities and station symbols
        run: node --test tests/line-overview-presentation.test.cjs tests/train-overview-dom.test.cjs
      - name: Check JavaScript syntax
        run: |
          node --check js/train-vehicle.js
          node --check data/timetables/vehicle-garage-png-map.js
          node --check data/core/major-vehicle-fleet-presets.js
          node --check js/trains-render.js
          node --check js/data-fusion.js
          node --check js/train-position-estimator.js
          node --check data/timetables/jreast-ishinomaki-2611-number-index.js
          node --check data/timetables/jreast-oga-2611-number-index.js
          node --check data/timetables/jreast-rikuto-east-2611-number-index.js
          node --check data/timetables/jreast-rikutsu-west-2611-number-index.js
          node --check data/timetables/jreast-ominato-2611-number-index.js
          node --check data/timetables/jreast-iiyama-2611-number-index.js
          node --check data/timetables/jreast-hakushin-2611-number-index.js
          node --check data/timetables/jreast-kitakami-2611-number-index.js
          node --check data/timetables/jreast-yamada-2611-number-index.js
          node --check data/timetables/jreast-regional-2611-number-index.js
          node --check data/timetables/jreast-sotetsu-jr-direct-2611-number-index.js
      - name: Verify Gakkentoshi–Osaka Higashi transfer ownership and fleet scope
        run: node --test tests/gakkentoshi-transfer-source-ownership.test.cjs
      - name: Verify JR Takarazuka full 31-station rail topology and generated bundles
        run: node --test tests/fukuchiyama-line-stations-2611.test.cjs
      - name: Verify JR Takarazuka historical fleet references (unconfirmed, no PNG)
        run: node --test tests/fukuchiyama-2611-fleet-reference.test.cjs
      - name: Verify JR Takarazuka C-number PNG illustration and M/MO candidate safety
        run: node --test tests/fukuchiyama-1199ch-candidate-marker.test.cjs
      - name: Verify northern Fukuchiyama local 223-5500 fleet stays line-scoped
        run: node --test tests/fukuchiyama-north-local-fleet-scope.test.cjs
      - name: Verify Fukuchiyama November 2531M official north sample and 2774M type reconciliation
        run: node --test tests/fukuchiyama-2611-official-north-sample.test.cjs
      - name: Verify Fukuchiyama northbound 2528M and 2532M official November samples
        run: node --test tests/fukuchiyama-2611-northbound-official-samples.test.cjs
