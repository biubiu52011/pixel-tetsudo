name: One-shot regenerate downstream PNG evidence snapshots
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-downstream-png-audits-20261118.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild current service and JR East PNG views from latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6 7; do
            git fetch origin main
            git reset --hard origin/main
            node tools/build-current-service-png-number-map.cjs --write
            node tools/build-jr-east-png-folder-number-map.cjs --write
            node tools/build-current-service-png-number-map.cjs --check
            node tools/build-jr-east-png-folder-number-map.cjs --check
            node --test tests/png-current-service-number-map.test.cjs tests/jr-east-png-folder-number-map.test.cjs
            rm -f .github/workflows/rebuild-downstream-png-audits-20261118.yml
            git add -A -- data/audits/png-current-service-number-map-20261116.json data/audits/png-current-service-number-map-20261116.csv data/audits/jr-east-png-folder-number-map-2611.json data/audits/jr-east-png-folder-number-map-2611.csv .github/workflows/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore: sync downstream current-service PNG audit snapshots"
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
