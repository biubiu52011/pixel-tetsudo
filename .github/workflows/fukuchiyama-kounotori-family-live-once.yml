name: One-off Fukuchiyama Kounotori fleet and Friday API smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fukuchiyama-kounotori-family-live-once.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check deployed 2026-11 30xx/70xx families, Friday 7025M, date expiry
        run: |
          node <<'JS'
          const base='https://pnupwfmgbtxqhpzsrhfn.supabase.co/functions/v1/train-runs';
          async function day(date){
            const r=await fetch(base+'?line_id=Fukuchiyama&service_date='+date,{
              headers:{accept:'application/json'},signal:AbortSignal.timeout(55000)});
            const b=await r.text();
            if(!r.ok)throw Error(date+' HTTP '+r.status+' '+b.slice(0,1200));
            const json=JSON.parse(b);
            if(json.ok!==true||!Array.isArray(json.runs))
              throw Error(date+' bad API '+b.slice(0,1000));
            return json;
          }
          function validFamilies(o){
            const xs=o.runs.filter(x=>/^(30|70)[0-9]{2}MH?$/.test(x.train_number));
            if(xs.length<10)throw Error(o.service_date+' too few express sources '+xs.length);
            for(const x of xs){
              if(x.train_type!=='odpt.TrainType:JR-West.LimitedExpress'||
                 x.vehicle_type_candidates!=='287系 / 289系'||
                 x.vehicle_plan_confirmed!==false||
                 x.vehicle_artwork_path!==null)
                throw Error(o.service_date+' '+x.train_number+' incorrect fleet / type '+
                  JSON.stringify({type:x.train_type,fleet:x.vehicle_type_candidates,art:x.vehicle_artwork_path}));
            }
            return xs.length;
          }
          const weekend=await day('2026-11-08');
          const wkCount=validFamilies(weekend);
          const extra=weekend.runs.filter(x=>x.train_number==='7025MH');
          if(extra.length!==1||extra[0].stops.length!==11||extra[0].timetable_date_verified!==true)
            throw Error('7025MH weekend variant is not exactly dated');
          if(weekend.complete!==false||weekend.partial!==true)
            throw Error('Full-line coverage falsely reported');
          console.log('2026-11-08 PASS',{runs:weekend.runs.length,express:wkCount,dated:weekend.date_verified_runs});
          const friday=await day('2026-11-06');
          const frCount=validFamilies(friday);
          const fr=friday.runs.filter(x=>x.train_number==='7025M');
          if(fr.length!==1||fr[0].stops.length!==11||
             fr[0].source_template_id!==2611087025001||
             fr[0].timetable_date_verified!==true||
             fr[0].timetable_provenance!=='official-sampled:fukuchiyama:2611:7025M-friday'||
             fr[0].stops[0].station_key!=='Osaka'||fr[0].stops[10].station_key!=='Fukuchiyama')
            throw Error('7025M November Friday service is incorrect '+JSON.stringify(fr).slice(0,1200));
          console.log('2026-11-06 PASS',{runs:friday.runs.length,express:frCount,dated:friday.date_verified_runs});
          const monday=await day('2026-11-09');
          validFamilies(monday);
          if(monday.runs.some(x=>/^70[0-9]{2}MH?$/.test(x.train_number)))
            throw Error('Seasonal 70xx erroneously present on Monday');
          console.log('2026-11-09 PASS no 70xx extras');
          const expired=await day('2026-12-01');
          if(expired.runs.some(x=>/^70[0-9]{2}MH?$/.test(x.train_number)))
            throw Error('November 70xx extras leaked in December');
          console.log('2026-12-01 PASS no expired 70xx');
          JS
