name: Verify Tobu dated SQL plan runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-tobu-skytree-gtfs-runtime.yml'
      - 'supabase/functions/train-runs/index.ts'
      - 'supabase/migrations/20261113183000_tobu_skytree_tokyogtfs_plan_fallback.sql'
      - 'supabase/migrations/20261113191000_tobu_noda_tokyogtfs_plan_fallback.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check live GTFS-sourced plan, weekends, and expiry
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base='https://pnupwfmgbtxqhpzsrhfn.supabase.co/functions/v1/train-runs'
          cases = [
              ('TobuSkytree', 'Tobu.TobuSkytree.', [('2026-11-13',909),('2026-11-14',829),('2027-11-03',0)]),
              ('Noda', 'Tobu.TobuUrbanPark.', [('2026-11-13',652),('2026-11-14',595),('2027-11-03',0)]),
          ]
          for line, trip_prefix, dates in cases:
              prefix='gtfs-stage:TokyoGTFS:bb1bf605817e7a3a65caffbcd019843aa0ffd5cb3b2c9fbb0444c8b3072ff87f:'+line
              for day, expected in dates:
                  qs=urllib.parse.urlencode({'line_id':line,'service_date':day})
                  with urllib.request.urlopen(base+'?'+qs,timeout=90) as resp:
                      if resp.status!=200: raise RuntimeError('Edge status='+str(resp.status))
                      obj=json.load(resp)
                  if obj.get('ok') is not True:
                      raise AssertionError(f'{line} {day}: '+str(obj.get('error')))
                  runs=obj.get('runs')
                  if not isinstance(runs,list) or len(runs)!=expected:
                      raise AssertionError(f'{line} {day}: expected {expected} runs, received {len(runs) if isinstance(runs,list) else type(runs)}')
                  for run in runs:
                      assert run.get('timetable_provenance')==prefix, (line,day,run.get('timetable_provenance'))
                      assert run.get('source_trip_id','').startswith(trip_prefix), (line,day)
                      assert run.get('service_date')==day, (line,day)
                      assert len(run.get('stops') or [])>=2, (line,day)
                      assert not run.get('vehicle_plan_confirmed'), 'GTFS train number is not physical vehicle evidence'
                  print(line,day,'verified',len(runs),'scheduled GTFS source-only trips')
          PY
