<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; upgrade-insecure-requests; frame-src https://www.openstreetmap.org; object-src none;"
    />
    <meta name="color-scheme" content="light" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#008803" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Pixel Tetsudo - Route Search" />
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=(self)"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Pixel Tetsudo</title>
    <link rel="icon" href="../images/pixel-tetsudo.ico" type="image/x-icon" />
    <script src="../js/lang-init.js"></script>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/lang-bar.css" />
    <link rel="stylesheet" href="../css/tourism-styles.css" />
  </head>
  <body data-page="history">
    <div id="app" data-site-shell-root>
      <div data-site-shell-mount="header"></div>
      <div data-site-shell-mount="navigation"></div>

      <main id="page-main">
        <section id="tab-history" class="tab-content active">
          <div id="historyContainer" class="pixel-card">
            <!-- history.js owns the content of this stable mount. -->
          </div>
        </section>
      </main>

      <div data-site-shell-mount="footer"></div>
    </div>

    <script src="../js/tourism-type.js"></script>
    <script src="../data/core/db-loader.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/site-shell.js"></script>
    <script src="../js/station-resolver.js"></script>
    <script src="../js/history.js"></script>
  </body>
</html>
