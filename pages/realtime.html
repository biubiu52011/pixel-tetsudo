<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://www.shonan-monorail.co.jp https://chiba-monorail.co.jp; font-src 'self'; connect-src 'self' https://api-challenge.odpt.org https://api.odpt.org https://r.jina.ai https://pnupwfmgbtxqhpzsrhfn.supabase.co; upgrade-insecure-requests; frame-src https://www.openstreetmap.org; object-src none;"
    />
    <meta name="color-scheme" content="light" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#008803" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Pixel Tetsudo - Realtime Status" />
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=(self)"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Pixel Tetsudo</title>
    <link rel="icon" href="../images/pixel-tetsudo.ico" type="image/x-icon" />
    <script src="../js/lang-init.js"></script>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/lang-bar.css" />
    <link rel="stylesheet" href="../css/realtime.css" />
    <link rel="preconnect" href="https://api.odpt.org" crossorigin />
    <link rel="preconnect" href="https://api-challenge.odpt.org" crossorigin />
  </head>
  <body data-page="realtime">
    <div id="app" data-site-shell-root>
      <div data-site-shell-mount="header"></div>
      <div data-site-shell-mount="navigation"></div>

      <main id="page-main">
        <section id="tab-status" class="tab-content active">
          <div class="railway-browser" data-railway-browser>
            <div id="realtimeFilterBar" class="rs-filter-bar"></div>
            <div class="pixel-card rs-line-list-shell">
              <div
                id="realtimeStatusContainer"
                class="rs-line-list-content"
                data-state-host="railway-lines"
              ></div>
            </div>
          </div>
        </section>
      </main>

      <div data-site-shell-mount="footer"></div>

      <div id="lineDetailModal" class="rs-modal">
        <div class="rs-modal-content">
          <div class="rs-modal-header">
            <button class="rs-modal-close" aria-label="close">
              <svg
                class="pt-icon"
                viewBox="0 0 14 14"
                width="12"
                height="12"
                fill="currentColor"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M1.707.293A1 1 0 0 0 .293 1.707L5.586 7 .293 12.293a1 1 0 1 0 1.414 1.414L7 8.414l5.293 5.293A1 1 0 0 0 12.293.293L7 5.586z"
                />
              </svg>
            </button>
            <h2 class="rs-modal-title"></h2>
          </div>
          <div class="rs-modal-body">
            <div class="rs-status-section">
              <span class="rs-status-indicator"
                ><span></span><span class="rs-status-text"></span
              ></span>
            </div>
            <div class="rs-interval-section">
              <div class="rs-info-label"></div>
              <div class="rs-interval-stations"></div>
            </div>
            <div class="rs-cause-section">
              <div class="rs-section-title"></div>
              <div class="rs-cause-text"></div>
            </div>
            <div class="rs-updated-section">
              <div class="rs-info-label"></div>
              <div class="rs-updated-time"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../data/core/db-loader.js"></script>
    <script src="../data/core/data-config-bundle.js"></script>
    <script src="../data/api/odpt-links.js"></script>
    <script src="../data/api/odpt-unified.js"></script>
    <script src="../js/running-chain-resolver.js"></script>
    <script src="../js/train-vehicle.js"></script>
    <script src="../data/timetables/vehicle-operation-evidence-data.js"></script>
    <script src="../js/train-position-estimator.js"></script>
    <script src="../js/runinfo-evaluator.js"></script>
    <script src="../js/runinfo-web.js"></script>
    <script src="../js/data-fusion.js"></script>
    <script src="../js/translations.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/line-presentation-service.js"></script>
    <script src="../js/data-state.js"></script>
    <script src="../js/site-shell.js"></script>
    <script src="../js/delay-translator.js"></script>
    <script src="../js/realtime-view.js"></script>
  </body>
</html>
