    />

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#008803" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Pixel Tetsudo - Realtime Status" />
    <meta
      http-equiv="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=(self)"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Pixel Tetsudo</title>
    <link rel="icon" href="../images/pixel-tetsudo.ico" type="image/x-icon" />

    <script src="../js/lang-init.js?v=8403c4a5e6a6"></script>
    <!-- pt:scripts:head:end -->
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/lang-bar.css?v=384feb036550" />
    <link rel="stylesheet" href="../css/realtime.css" />
    <link rel="stylesheet" href="../css/ux-refinements.css?v=27e6eab87cb1" />

  <body data-page="realtime">
    <div id="app" data-site-shell-root>
      <div data-site-shell-mount="header"></div>
      <div data-site-shell-mount="navigation"></div>

      <main id="page-main">
        <section id="tab-status" class="tab-content active">
          <div class="railway-browser" data-railway-browser>
            <div id="realtimeFilterBar" class="rs-filter-bar"></div>
            <div class="pixel-card rs-line-list-shell">
              <div
                id="realtimeStatusContainer"
                class="rs-line-list-content"
                data-state-host="railway-lines"
              ></div>
            </div>
          </div>
        </section>
      </main>

      <div data-site-shell-mount="footer"></div>

      <div id="lineDetailModal" class="rs-modal" role="dialog" aria-modal="true" aria-labelledby="rsModalTitle">
        <div class="rs-modal-content">
          <div class="rs-modal-header">
            <h2 id="rsModalTitle" class="rs-modal-title"></h2>
            <button type="button" class="rs-modal-close" aria-label="閉じる">
              <span aria-hidden="true" class="rs-close-glyph">×</span>
            </button>
          </div>
          <div class="rs-modal-body">
            <div class="rs-status-section">
              <span class="rs-status-indicator"
                ><span></span><span class="rs-status-text"></span
              ></span>
            </div>
            <div class="rs-interval-section">
              <div class="rs-info-label"></div>
              <div class="rs-interval-stations"></div>
            </div>
            <div class="rs-cause-section">
              <div class="rs-section-title"></div>
              <div class="rs-cause-text"></div>
            </div>
            <div class="rs-updated-section">
              <div class="rs-info-label"></div>
              <div class="rs-updated-time"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- pt:scripts:body:start -->
    <script defer src="../data/core/db-loader.js?v=15c1ec92aad3"></script>
    <script defer src="../data/core/data-config-bundle.js?v=952c230dfa50"></script>
    <script defer src="../data/api/odpt-links.js?v=c3ef70c3b783"></script>
    <script defer src="../data/api/odpt-unified.js?v=3a9db1321b73"></script>
    <script defer src="../js/running-chain-resolver.js?v=bc85abcf005a"></script>
    <script defer src="../js/runinfo-evaluator.js?v=5c90d31f2a1c"></script>
    <script defer src="../js/runinfo-web.js?v=b56f4ff65030"></script>
    <script defer src="../js/data-fusion.js?v=472064fa0c2b"></script>
    <script defer src="../js/translations.js?v=5676c6c9e510"></script>
    <script defer src="../js/common.js?v=f0e903fc4c87"></script>
    <script defer src="../js/line-presentation-service.js?v=59d41bdf160c"></script>
    <script defer src="../js/data-state.js?v=fb109fe63bc9"></script>
    <script defer src="../js/site-shell.js?v=89a3ffdcc1bb"></script>
    <script defer src="../js/delay-translator.js?v=f05b0ee2a4aa"></script>
    <script defer src="../js/realtime-view.js?v=b6a467ee2318"></script>
    <!-- pt:scripts:body:end -->
  </body>
</html>
