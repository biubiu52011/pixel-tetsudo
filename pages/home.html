<html lang="ja">
  <head>
    <meta charset="UTF-8" />

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://www.shonan-monorail.co.jp https://chiba-monorail.co.jp; font-src 'self'; connect-src 'self' https://api-challenge.odpt.org https://api.odpt.org https://r.jina.ai https://pnupwfmgbtxqhpzsrhfn.supabase.co; upgrade-insecure-requests; frame-src https://www.openstreetmap.org; object-src none;"

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Pixel Tetsudo - Route Search" />
    <meta

      content="camera=(), microphone=(), geolocation=(self)"
    />

    <title>Pixel Tetsudo</title>
    <link rel="icon" href="../images/pixel-tetsudo.ico" type="image/x-icon" />

    <script src="../js/lang-init.js?v=8403c4a5e6a6"></script>

    <link rel="stylesheet" href="../css/style.css" />

  </head>
  <body data-page="home">
    <div id="app" data-site-shell-root>
      <div data-site-shell-mount="header"></div>
      <div data-site-shell-mount="navigation"></div>

      <main id="page-main">
        <section id="tab-search" class="tab-content active">
          <div class="home-modules">
            <div id="searchContainer" class="search-card pixel-card">
              <div class="module-title">
                <h2 data-i18n="search.title">路線検索</h2>
              </div>
              <div class="search-inputs">
                <div class="input-group">
                  <label class="input-label" for="searchFrom" data-i18n="search.fromLabel"
                    >出発駅</label
                  >
                  <input
                    type="text"
                    id="searchFrom"
                    class="search-input"
                    role="combobox"
                    aria-autocomplete="list"
                    aria-controls="fromSuggestions"
                    aria-expanded="false"
                    autocomplete="off"
                    spellcheck="false"
                    data-i18n-placeholder="search.fromPlaceholder"
                    placeholder="出発駅を入力してください"
                  />
                  <div id="fromSuggestions" class="suggestions" role="listbox"></div>
                </div>
                <button
                  id="swapBtn"
                  class="swap-btn"
                  type="button"
                  aria-label="出発駅と到着駅を入れ替える"
                  title="出発駅と到着駅を入れ替える"
                >
                  <svg
                    class="pt-icon"
                    viewBox="0 0 14 14"
                    width="16"
                    height="16"
                    fill="currentColor"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path
                      fill-rule="evenodd"
                      clip-rule="evenodd"
                      d="M8 0a1 1 0 0 0 0 2h1.5a.5.5 0 0 1 .5.5v6H8.5a.5.5 0 0 0-.354.854l2.5 2.5a.5.5 0 0 0 .708 0l2.5-2.5A.5.5 0 0 0 13.5 8.5H12v-6A2.5 2.5 0 0 0 9.5 0zM3.354 2.146a.5.5 0 0 0-.708 0l-2.5 2.5A.5.5 0 0 0 .5 5.5H2v6A2.5 2.5 0 0 0 4.5 14H6a1 1 0 1 0 0-2H4.5a.5.5 0 0 1-.5-.5v-6h1.5a.5.5 0 0 0 .354-.854z"
                    />
                  </svg>
                </button>
                <div class="input-group">
                  <label class="input-label" for="searchTo" data-i18n="search.toLabel"
                    >到着駅</label
                  >
                  <input
                    type="text"
                    id="searchTo"
                    class="search-input"
                    role="combobox"
                    aria-autocomplete="list"
                    aria-controls="toSuggestions"
                    aria-expanded="false"
                    autocomplete="off"
                    spellcheck="false"
                    data-i18n-placeholder="search.toPlaceholder"
                    placeholder="到着駅を入力してください"
                  />
                  <div id="toSuggestions" class="suggestions" role="listbox"></div>
                </div>
                <div class="search-time-controls">
                  <div
                    id="searchTimeGroupLabel"
                    class="search-time-group-label"
                    data-i18n="search.time_search"
                  >
                    時間検索
                  </div>
                  <label class="input-group" for="searchTimeMode"
                    ><span
                      class="input-label visually-hidden"
                      data-i18n="search.time_mode"
                      >時刻モード</span
                    ><select id="searchTimeMode" class="search-input">
                      <option value="now" data-i18n="search.now">
                        今すぐ出発
                      </option>
                      <option value="depart" data-i18n="search.depart_at">
                        出発時刻を指定
                      </option>
                      <option value="arrive" data-i18n="search.arrive_by">
                        到着時刻を指定
                      </option>
                    </select></label
                  >
                  <label class="input-group" for="searchTime"
                    ><span
                      class="input-label visually-hidden"
                      data-i18n="search.time_jst"
                      >時刻</span
                    ><input
                      id="searchTime"
                      class="search-input"
                      type="time"
                      disabled
                  /></label>
                </div>
                <button
                  id="searchBtn"
                  class="search-btn"
                  data-i18n="search.btn"
                >
                  検索
                </button>
              </div>
              <div id="searchResults" class="search-results"></div>
            </div>
            <div id="smModule" class="sm-module pixel-card">
              <div class="module-title">
                <h2 data-i18n="tourism.title">観光スポット</h2>
              </div>
              <div class="sm-location-bar">
                <div class="sm-location-info">
                  <span
                    class="sm-location-label"
                    data-i18n="tourism.select_station"
                    >最寄り駅</span
                  >
                  <span id="smStationDisplay" class="sm-station-display">
                  </span>
                </div>
                <button
                  id="smRelocateBtn"
                  class="sm-relocate-btn"
                  title="現在位置を更新"
                  aria-label="Relocate to current position"
                >
                  <svg
                    class="sm-relocate-icon"
                    viewBox="0 0 1024 1024"
                    width="16"
                    height="16"
                    fill="currentColor"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M684.032 403.456q-17.408-8.192-15.872-22.016t11.776-22.016q3.072-2.048 19.968-15.872t41.472-33.28q-43.008-49.152-102.4-77.312t-129.024-28.16q-64.512 0-120.832 24.064t-98.304 66.048-66.048 98.304-24.064 120.832q0 63.488 24.064 119.808t66.048 98.304 98.304 66.048 120.832 24.064q53.248 0 100.864-16.896t87.04-47.616 67.584-72.192 41.472-90.624q7.168-23.552 26.624-38.912t46.08-15.36q31.744 0 53.76 22.528t22.016 53.248q0 14.336-5.12 27.648-21.504 71.68-63.488 132.096t-99.84 103.936-128.512 68.096-148.48 24.576q-95.232 0-179.2-35.84t-145.92-98.304-98.304-145.92-36.352-178.688 36.352-179.2 98.304-145.92 145.92-98.304 179.2-36.352q105.472 0 195.584 43.52t153.6 118.272q23.552-17.408 39.424-30.208t19.968-15.872q6.144-5.12 13.312-7.68t13.312 0 10.752 10.752 6.656 24.576q1.024 9.216 2.048 31.232t2.048 51.2 1.024 60.416-1.024 58.88q-1.024 34.816-16.384 50.176-8.192 8.192-24.576 9.216t-34.816-3.072q-27.648-6.144-60.928-13.312t-63.488-14.848-53.248-14.336-29.184-9.728z"
                      p-id="7294"
                    ></path>
                  </svg>
                </button>
              </div>
              <div id="smTagFilters" class="sm-tag-filters"></div>
              <div class="sm-content">
                <div id="smGrid" class="sm-grid"></div>
                <div id="smEmpty" class="sm-empty hidden">
                  <span data-i18n="tourism.no_spots"
                    >周辺のスポットがありません</span
                  >
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <div data-site-shell-mount="footer"></div>
    </div>

    <script defer src="../js/tourism-proximity.js?v=47168d13e958"></script>

  </body>
</html>
